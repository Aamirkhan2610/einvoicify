services:
  postgres:
    image: postgres:16-alpine
    container_name: einvoicify-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: einvoicify
      POSTGRES_PASSWORD: einvoicify_dev
      POSTGRES_DB: einvoicify
    volumes:
      - einvoicify_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U einvoicify -d einvoicify"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  einvoicify_pg_data:
